<!-- CSP estricta: sin conexiones externas, sin eval. Prism se carga como
     script propio (renderer/vendor/prism.js), así que 'self' alcanza. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0a0a0a;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  /* La marca exacta del ícono, sin la baldosa (Fran, 3/11/2026), aflora:
     sube 8 px y crece de .96, como entra todo en Opal. La escribe
     `npm run icon` desde tools/marca.cjs: no se toca a mano. */
  #boot-splash svg { width: 72px; height: 72px; display: block;
                     animation: boot-aflora .42s cubic-bezier(.16,1,.3,1) .08s both; }
  @keyframes boot-aflora { from { opacity: 0; transform: translateY(8px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { #boot-splash svg { animation: none; } }
</style>
