<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Prism se carga como
     script propio (renderer/vendor/prism.js), así que 'self' alcanza. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Vitra</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/vitra.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0a0a0a;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 46px; height: 46px; stroke: #f2f4f7; fill: none;
                     stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  /* La marca se DIBUJA, no aparece: primero el cuaderno, después la cinta. */
  #boot-splash path { stroke-dasharray: 40; stroke-dashoffset: 40;
                      animation: boot-draw .72s cubic-bezier(.16,1,.3,1) forwards; }
  #boot-splash path:last-child { stroke: #ffb454; stroke-dasharray: 10; stroke-dashoffset: 10;
                                 animation-delay: .1s; }
  @keyframes boot-draw { to { stroke-dashoffset: 0 } }
</style>

<div id="boot-splash">
  <svg viewBox="0 0 16 16">
    <path d="M4.5 2.5h7a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-7a1.5 1.5 0 0 1-1.5-1.5V4a1.5 1.5 0 0 1 1.5-1.5M5.75 2.5v11"/>
    <path d="M9 2.5v4.25l1.25-1 1.25 1V2.5"/>
  </svg>
</div>

<div class="op-app">

  <!-- El sustrato. En el vidrio acrílico es la pila de UmbroSys sobre el
       escritorio que desenfoca Windows (shell.css). Una capa, estática. -->
  <div class="op-fog" aria-hidden="true"></div>

  <!-- ── Titlebar propia: aire, sin relleno ni línea ───────────────────────── -->
  <header class="op-titlebar">
    <div class="op-brand op-no-drag" data-tip="Vitra" id="brand">
      <svg class="op-brand__mark op-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4.5 2.5h7a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-7a1.5 1.5 0 0 1-1.5-1.5V4a1.5 1.5 0 0 1 1.5-1.5M5.75 2.5v11"/>
        <path class="op-brand__trail" d="M9 2.5v4.25l1.25-1 1.25 1V2.5"/>
      </svg>
      <span class="op-brand__name">Vitra</span>
    </div>
    <div class="op-titlebar__context" id="titlebar-context"></div>
  </header>

  <div class="op-wincontrols">
    <button class="op-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
    <button class="op-wincontrol op-iconswap" id="win-max" aria-label="Maximizar"><i data-icon="winMax"></i><i data-icon="winRestore"></i></button>
    <button class="op-wincontrol op-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
  </div>

  <!-- ── El Diario: tres hojas (renderer/js/diario/diario.js) ──────────────── -->
  <main class="vt-diario" id="diario"></main>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="op-layer"></div>

<script type="module" src="./js/app.js"></script>
