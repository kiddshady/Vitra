<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Prism se carga como
     script propio (renderer/vendor/prism.js), así que 'self' alcanza. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Viper</title>

<link rel="stylesheet" href="./css/fonts.css">

<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0a0a0a;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  /* La marca exacta del ícono, sin la baldosa (Fran, 3/11/2026), aflora:
     sube 8 px y crece de .96, como entra todo en Opal. La escribe
     `npm run icon` desde tools/marca.cjs: no se toca a mano. */
  #boot-splash svg { width: 72px; height: 72px; display: block;
                     animation: boot-aflora .42s cubic-bezier(.16,1,.3,1) .08s both; }
  @keyframes boot-aflora { from { opacity: 0; transform: translateY(8px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { #boot-splash svg { animation: none; } }
</style>

</defs><g clip-path="url(#vp-sp-c)">
<path d="M196 120c-4-46-76-62-98-20c-16 30 2 56 22 76c40 92 82 170 136 220c46-54 74-140 96-214" fill="none" stroke="url(#vp-sp-g)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196 120c-4-46-76-62-98-20c-16 30 2 56 22 76c40 92 82 170 136 220c46-54 74-140 96-214" fill="none" stroke="#0a110c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 24" opacity=".55"/>
<path d="M318 196c-6-52 18-96 64-110c34 12 46 52 30 90c-22 30-62 40-94 20z" fill="rgb(156,230,80)"/>

</g></svg><!-- /marca:splash --></div>

    </div>
    <div class="op-titlebar__context" id="titlebar-context"></div>

  <div class="op-wincontrols">
    <button class="op-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
    <button class="op-wincontrol op-iconswap" id="win-max" aria-label="Maximizar"><i data-icon="winMax"></i><i data-icon="winRestore"></i></button>
    <button class="op-wincontrol op-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
  </div>

  <!-- ── El Diario: tres hojas (renderer/js/diario/diario.js) ──────────────── -->

</div>
